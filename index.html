<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ClinicMaster</title>
	<meta name="robots" content="noindex">

	<!-- The site itself lives in package/src/. This file only exists so that a static
	     server pointed at the repository root opens the site instead of a directory listing. -->
	<meta http-equiv="refresh" content="0; url=package/src/index.html">
	<link rel="canonical" href="package/src/index.html">
	<script>location.replace("package/src/index.html" + location.search + location.hash);</script>
</head>
<body>
	<p>Redirecting to <a href="package/src/index.html">package/src/index.html</a>&hellip;</p>
</body>
</html>
